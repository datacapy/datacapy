version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    labels:
      - dependencies
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /package/id
    schedule:
      interval: daily
    labels:
      - dependencies
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /package/migrate
    schedule:
      interval: daily
    labels:
      - dependencies
    ignore:
      # 1.9.7 rewrites './repo' to './index.js' in om's dist (baseUrl clash); stay on 1.9.1 until fixed
      - dependency-name: tsc-alias
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /package/om
    schedule:
      interval: daily
    labels:
      - dependencies
    ignore:
      # 1.9.7 rewrites './repo' to './index.js' in om's dist (baseUrl clash); stay on 1.9.1 until fixed
      - dependency-name: tsc-alias
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /package/schema
    schedule:
      interval: daily
    labels:
      - dependencies
    ignore:
      # 1.9.7 rewrites './repo' to './index.js' in om's dist (baseUrl clash); stay on 1.9.1 until fixed
      - dependency-name: tsc-alias
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /package/server
    schedule:
      interval: daily
    labels:
      - dependencies
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
